  --or-100:#2B1200; --or-200:#7A2F00; --or-300:#E05E00; --or-400:#FF7A26; --or-500:#FF9B59; --or-600:#FFC49E; --or-700:#FFE0CC;
  --pk-100:#3C001D; --pk-200:#7B0239; --pk-300:#FF7FAE; --pk-400:#FF5190;
  --tq-300:#29CECB; --tq-500:#178B89;
  --gr-100:#295236; --gr-200:#2F6640; --gr-300:#38814E; --gr-400:#4FA86A; --gr-500:#6EBA85; --gr-600:#CAE8D3; --gr-700:#E4F4E8;
  --q-100:#003755; --q-150:#00486E; --q-200:#005987; --q-300:#007EBB;
  --g-0:#121212; --g-100:#1F1F1F; --g-200:#2F2F2F; --g-300:#36363C; --g-400:#54585D; --g-500:#6B6F76; --g-600:#83868D; --g-700:#A2A4AA; --g-800:#B7B8BD; --g-900:#D9DADD; --g-1000:#FDFDFD;
  --err-100:#3A1A1A; --err-200:#7A2424; --err-300:#FF4C4C; --ok-100:#07310B; --ok-200:#1D5F1D; --ok-300:#38A738; --info-100:#1C2A55; --info-200:#6B8CFF;
  --bg:#121212;
  --av-green-bg:#295236; --av-green-ic:#4FA86A; --av-red-bg:#522C2C; --av-red-ic:#BB4141; --av-turq-bg:#215E5E; --av-turq-ic:#1C9E9E; --av-orange-bg:#473325; --av-orange-ic:#A55116; --av-purple-bg:#2B2B51; --av-purple-ic:#6363FF;
  --av-navy-bg:#002744; --av-navy-ic:#227FBD; --av-brown-bg:#35271E; --av-brown-ic:#9A7259; --av-cream-bg:#382C1D; --av-cream-ic:#A98635; --av-pink-bg:#3A182B; --av-pink-ic:#9E4064; --av-blue-bg:#003755; --av-blue-ic:#007EBB;
  --p-fill:#0A85D0; --surf:#1F1F1F; --line:#2F2F2F;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--page);color:var(--g-1000);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px 12px;min-height:100vh}
button{font-family:inherit;border:0;background:none;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,[role=button]:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--p-400);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.ic{display:block;flex:none;pointer-events:none}
svg.i{width:24px;height:24px}

/* ---- üst başlık satırı (index.html .cap ile aynı) ---- */
.cap{font-size:12px;color:var(--g-700);text-align:center;display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.cap b{color:var(--g-900)}
.nsw{height:30px;padding:0 12px;border-radius:999px;background:var(--pill);font-size:12px;font-weight:700;color:var(--g-900);box-shadow:0 1px 3px rgba(0,0,0,.08);vertical-align:middle}
.nsw.on{background:var(--g-1000);color:var(--g-0)}
.nsw:disabled{opacity:.4;cursor:default}

/* ---- telefon çerçevesi (index.html ile aynı) ---- */
.stage{position:relative;flex:none;width:390px;height:844px}
.phone{--sbh:47px;width:390px;height:844px;border-radius:48px;background:var(--bg);color:var(--g-1000);overflow:hidden;overflow:clip;position:absolute;left:0;top:0;transform-origin:top left;box-shadow:0 0 0 10px #111,0 0 0 11px #333,0 30px 60px rgba(0,0,0,.25)}
.sb{position:absolute;top:0;left:0;right:0;height:47px;display:flex;align-items:center;justify-content:space-between;padding:0 30px 0 34px;font-size:15px;font-weight:600;z-index:90;pointer-events:none}
.sb .island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:120px;height:34px;background:#000;border-radius:20px}
.home{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--g-1000);z-index:95;pointer-events:none}
.phone.incall .sb{color:#fff}.phone.incall .home{background:#fff}
.phone.incall.light .sb{color:#121212}.phone.incall.light .home{background:#121212}
.toast{position:absolute;left:50%;top:104px;transform:translate(-50%,-6px);z-index:96;background:rgba(31,31,31,.96);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:340px;text-align:center;line-height:1.35}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* arama ekranı her temada koyu ve aynı: kabuk değişkenleri içeri sızmasın */
#call{--p-400:#0073E6;--green:#4FA86A;--ok:#38A738;--orange:#E05E00;z-index:40;color:#fff}
#call[hidden]{display:none}

/* ---- BiP kabuğu: Aramalar sekmesi ---- */
#shell{position:absolute;inset:0;z-index:1;background:var(--bg)}
.s-view{position:absolute;inset:0;padding-top:var(--sbh);display:flex;flex-direction:column;background:var(--bg);padding-bottom:84px}
.s-head{display:flex;align-items:center;gap:8px;padding:6px 12px 8px;min-height:60px;flex:none}
.s-head h1{flex:1;text-align:center;font-size:20px;font-weight:600;letter-spacing:-.01em}
.s-rb{width:44px;height:44px;border-radius:50%;background:var(--g-300);color:var(--g-1000);display:grid;place-items:center;flex:none}
.s-rb.p{background:var(--p-fill);color:#fff}
.s-rb:active{filter:brightness(.92)}
.s-search{display:flex;align-items:center;gap:10px;margin:2px 16px 8px;height:44px;border-radius:22px;background:var(--g-300);padding:0 14px;color:var(--g-700);flex:none}
.s-search input{flex:1;min-width:0;align-self:stretch;border:0;outline:0;background:none;font:inherit;font-size:16px;color:var(--g-1000)}
.s-scroll{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none}
.s-scroll::-webkit-scrollbar{display:none}
.s-fav{display:flex;align-items:center;gap:14px;width:100%;padding:12px 16px 14px;text-align:left;border-bottom:1px solid var(--g-300);min-height:72px}
.s-ico{width:50px;height:50px;border-radius:50%;background:var(--p-fill);color:#fff;display:grid;place-items:center;flex:none}
.s-fav b{display:block;font-size:17px;font-weight:500;color:var(--p-400)}
.s-fav small{font-size:15px;color:var(--g-700)}
.s-sec{font-size:20px;font-weight:700;padding:16px 16px 6px}
.s-row{display:flex;align-items:center;gap:14px;padding:6px 6px 6px 16px;cursor:pointer;min-height:68px}
.s-row:active{background:var(--g-200)}
.s-row:focus-visible{outline-offset:-2px}
.s-av{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;flex:none;overflow:hidden;background:var(--av-navy-bg);color:var(--av-navy-ic)}
.s-av img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.s-av.a0{background:var(--av-green-bg);color:var(--av-green-ic)}.s-av.a1{background:var(--av-red-bg);color:var(--av-red-ic)}.s-av.a2{background:var(--av-turq-bg);color:var(--av-turq-ic)}
.s-av.a3{background:var(--av-orange-bg);color:var(--av-orange-ic)}.s-av.a4{background:var(--av-purple-bg);color:var(--av-purple-ic)}.s-av.a5{background:var(--av-navy-bg);color:var(--av-navy-ic)}
.s-av.a6{background:var(--av-brown-bg);color:var(--av-brown-ic)}.s-av.a7{background:var(--av-cream-bg);color:var(--av-cream-ic)}.s-av.a8{background:var(--av-pink-bg);color:var(--av-pink-ic)}.s-av.a9{background:var(--av-blue-bg);color:var(--av-blue-ic)}
.s-av.g{background:var(--av-navy-bg);color:var(--av-navy-ic)}
.s-av svg{width:26px;height:26px;fill:currentColor}
.s-bd{flex:1;min-width:0;align-self:stretch;display:flex;flex-direction:column;justify-content:center;gap:2px;border-bottom:1px solid var(--g-300);margin:-6px 0;padding:6px 0}
.s-bd b{font-size:17px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-bd b.miss{color:var(--err-300)}
.s-sub{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--g-700)}
.s-sub svg{width:16px;height:16px}
.s-sub.miss{color:var(--g-700)}
.s-tm{font-size:15px;color:var(--g-700);flex:none;align-self:center}
.s-info{width:44px;height:44px;display:grid;place-items:center;flex:none;color:var(--g-1000)}
.s-info svg{width:28px;height:28px}
.s-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:56px 28px;text-align:center}
.s-empty b{font-size:16px;font-weight:600}.s-empty p{font-size:14px;color:var(--g-700);line-height:1.5}
.s-tabbar{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;align-items:center;height:84px;padding:6px 2px 26px;border-top:1px solid var(--g-300);background:var(--bg)}
.s-tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--g-800);min-width:66px;min-height:46px;justify-content:center}
.s-tab svg{width:26px;height:26px;fill:none}
.s-tab.on{color:var(--g-1000);font-weight:700}.s-tab.on svg{fill:currentColor}

/* ---- alt sayfalar: Yeni arama, arama bilgisi, ⋯ ---- */
.s-dim{position:absolute;inset:0;background:rgba(18,18,18,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.s-dim.on{opacity:1;pointer-events:auto}
.s-sheet{position:absolute;left:0;right:0;bottom:0;z-index:31;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(105%);visibility:hidden;transition:transform .3s var(--ease),visibility 0s .3s;display:flex;flex-direction:column;overflow:hidden}
.s-sheet.on{transform:none;visibility:visible;transition:transform .3s var(--ease)}
.s-grab{width:44px;height:5px;border-radius:3px;background:var(--g-500);margin:8px auto 0;flex:none}
.s-sh{position:relative;display:flex;align-items:center;justify-content:center;min-height:58px;flex:none}
.s-sh h3{font-size:18px;font-weight:600}
.s-sh .s-rb{position:absolute;right:12px;top:7px}
.s-new{top:44px}
.s-nadd{flex:none}
.s-nh{display:flex;align-items:center;gap:8px;padding:6px 16px 10px}.s-nh b{font-size:17px}.s-nh em{margin-left:auto;font-style:normal;color:var(--g-700)}
.s-nh .inf{width:24px;height:24px;border-radius:50%;background:var(--p-fill);color:#fff;display:grid;place-items:center;font-size:14px;font-weight:700;font-style:normal}
.s-chips{display:flex;gap:14px;overflow-x:auto;padding:18px 16px 10px;background:var(--g-300);scrollbar-width:none}
.s-cc{position:relative;flex:none;width:60px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--g-800)}
.s-cc .s-av{width:52px;height:52px}
.s-cc .rm{position:absolute;top:-4px;right:0;width:22px;height:22px;border-radius:50%;background:var(--g-700);color:#fff;font-size:14px;line-height:1}
.s-cc .rm::before{content:'';position:absolute;inset:-11px}
.s-nl{flex:1;overflow-y:auto;min-height:0;padding:0 30px 104px 0;scrollbar-width:none}.s-nl::-webkit-scrollbar{display:none}
.s-cr{display:flex;align-items:center;gap:14px;width:100%;min-height:62px;padding:8px 14px 8px 16px;text-align:left}
.s-cr .s-av{width:44px;height:44px}
.s-cr .nm{flex:1;min-width:0;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s-cr .rad{width:26px;height:26px;border-radius:50%;border:2px solid var(--g-600);flex:none;display:grid;place-items:center}.s-cr .rad.on{background:var(--p-fill);border-color:var(--p-fill)}
.s-cr .s-ico{width:44px;height:44px}
.s-nsec{font-size:18px;font-weight:700;padding:14px 16px 6px}.s-nempty{padding:40px 16px;text-align:center;color:var(--g-700)}
.s-nidx{position:absolute;right:3px;top:150px;display:flex;flex-direction:column;align-items:center;z-index:2}
.s-nidx button{width:22px;height:17px;font-size:11px;font-weight:800;color:var(--p-400);line-height:1}
.s-ngo{position:absolute;left:16px;right:16px;bottom:26px;display:flex;gap:12px;z-index:3}
.s-ngo button{flex:1;height:56px;border-radius:18px;background:var(--p-fill);color:#fff;font-size:19px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 18px rgba(13,178,255,.35)}
.s-small{padding-bottom:34px}
.s-opt{display:flex;align-items:center;gap:14px;width:100%;min-height:56px;padding:0 20px;font-size:17px;text-align:left}
.s-opt.danger{color:var(--err-300)}
.s-opt+.s-opt{border-top:1px solid var(--g-300)}

/* ---- grup avatarı: önde 2 yüz, arkada +N ---- */
.gav{--ring:var(--bg);position:relative;display:block;flex:none;width:var(--s);height:var(--s)}
.gav>.s-av{position:absolute;width:64%;height:64%;border:calc(var(--s)*.045) solid var(--ring)}
.gav>.f1{left:0;top:36%;z-index:2}.gav>.f2{left:36%;top:36%;z-index:3}
.gav>.gp{left:20%;top:0;z-index:1;display:flex;justify-content:center;align-items:flex-start;padding-top:calc(var(--s)*.06);font-size:calc(var(--s)*.19);font-weight:600;line-height:1;background:var(--gp-bg,var(--av-navy-bg));color:var(--gp-ic,var(--av-navy-ic))}
.gav.two>.f1,.gav.two>.f2{top:18%}
.gav.dk{--ring:var(--call-bg);--gp-bg:#002744;--gp-ic:#227FBD}

/* ---- Arama bilgisi (tam sayfa) ---- */
.s-dview{z-index:4}.s-dview[hidden]{display:none}
.s-hsp{width:44px;flex:none}
.s-dsc{flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding-bottom:16px}.s-dsc::-webkit-scrollbar{display:none}
.d-top{display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 16px 24px;text-align:center}
.d-top .s-av.big{width:100px;height:100px}
.d-top b{font-size:22px;font-weight:600;line-height:28px;max-width:100%}
.d-acts{display:flex;gap:8px;padding:0 16px 14px}
.d-acts button{flex:1;height:72px;border-radius:18px;background:var(--surf);color:var(--p-400);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:18px;font-weight:500}
.d-acts button:active,.d-pv:active{filter:brightness(.9)}
.d-day{background:var(--surf);padding:16px 16px 10px;margin-top:6px}
.d-day h3{font-size:19px;font-weight:500;margin-bottom:6px}
.d-call{display:grid;grid-template-columns:auto 22px 1fr;column-gap:10px;align-items:center;padding:6px 0 8px}
.d-call .tm{font-size:15px;color:var(--g-700)}
.d-call svg{width:20px;height:20px;color:var(--g-700)}
.d-call b{font-size:17px;font-weight:400;min-width:0}.d-call b.miss{color:var(--err-300)}
.d-call small{grid-column:2/4;font-size:15px;color:var(--g-700);margin-top:2px}
.d-sec{font-size:19px;font-weight:600;padding:22px 16px 10px}
.d-p{display:flex;align-items:center;gap:14px;padding:10px 16px 10px;background:var(--surf);min-height:72px}
.d-p+.d-p{border-top:1px solid var(--line)}
.d-p .s-av{width:48px;height:48px}
.s-av.me{background:var(--av-turq-bg)}
.s-av-w{flex:none;display:block}
.d-pb{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.d-pb b{font-size:18px;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.d-pb small{font-size:16px;color:var(--g-700)}
.d-pv{width:44px;height:44px;display:grid;place-items:center;flex:none;color:var(--p-400)}
.d-pv svg{width:28px;height:28px}

/* ---- telefon / tablet: çerçevesiz (index.html ile aynı) ---- */
@media (max-width:520px){
  body{padding:10px 6px;gap:10px}
}
@supports (height:100dvh){body{min-height:100dvh}}
@media (prefers-reduced-motion: reduce){.s-sheet,.s-dim,.toast{transition-duration:.01ms!important}}

/* ---- arama motoru: tüm kurallar #call altında (kabuk CSS'iyle çakışmaz) ---- */
#call button:focus-visible,#call [role=button]:focus-visible,#call input:focus-visible{outline:2px solid var(--call-accent);outline-offset:2px}
#call{position:absolute;inset:0;display:flex;flex-direction:column;padding:max(54px,calc(env(safe-area-inset-top,0px) + 10px)) 0 28px;overflow:hidden;background:var(--call-bg)}
#call .bgl{position:absolute;inset:0;z-index:0;overflow:hidden}
#call .fade{position:absolute;inset:0;z-index:1;background:linear-gradient(rgba(18,18,18,.6) 0%,rgba(18,18,18,0) 22%);pointer-events:none}
#call .vid{position:absolute;inset:0;background:var(--tbg,#2F2F2F);overflow:hidden}
#call .vid.blur{filter:blur(16px) saturate(.7);transform:scale(1.12)}
#call .sil{position:absolute;left:0;right:0;bottom:0;width:100%;height:78%}
#call .top{display:flex;align-items:flex-start;justify-content:space-between;padding:0 16px;flex:none;position:relative;z-index:5;min-height:46px}
#call .cbtn{width:44px;height:44px;border-radius:50%;background:var(--call-btn);color:#fff;display:grid;place-items:center;flex:none}
#call .cbtn:active{background:#6B6F76}
#call .cbtn:disabled{opacity:.4;cursor:default}
#call .cbtn.white{background:#fff;color:#1F1F1F}
#call .sp{width:44px;flex:none}
#call .ttl{display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:2px;min-width:0}
#call .ttl b{font-size:20px;font-weight:600;line-height:24px;white-space:nowrap}
#call .ttl span{display:flex;align-items:center;gap:6px;font-size:15px;color:var(--call-text-2);line-height:16px;white-space:nowrap}
#call .ttl span.warn{color:var(--call-warn)}
#call .ttl span.blue{color:var(--call-accent)}
#call .area{flex:1;min-height:0;position:relative;z-index:2}
#call .dock{flex:none;display:flex;flex-direction:column;gap:12px;position:relative;z-index:6}
#call .chiprow{display:flex;justify-content:center;margin-top:22px;flex:none;position:relative;z-index:5}
#call .chip{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:6px 14px;border-radius:999px;background:rgba(0,0,0,.55);font-size:13px;font-weight:500;color:#fff}
#call .chip.blue{background:var(--p-400)}
#call .chip.warn{color:var(--call-warn)}
#call .chip .mb{margin-left:-8px}
#call.wall{background-color:var(--call-bg);background-image:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220' fill='none' stroke='%231F1F1F' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><circle cx='30' cy='30' r='12'/><path d='M24 30h12M30 24v12'/><path d='M80 20q10-14 20 0t20 0'/><path d='M150 18l8 16 18 2-13 12 4 18-17-9-16 9 4-18-13-12 18-2z'/><rect x='20' y='80' width='34' height='26' rx='5'/><path d='M27 92h20M27 99h12'/><path d='M95 70c-8-10 4-22 14-12 10-10 22 2 14 12l-14 14z'/><path d='M170 85l25-12-8 28-6-10z'/><circle cx='60' cy='160' r='16'/><circle cx='54' cy='156' r='1.5'/><circle cx='66' cy='156' r='1.5'/><path d='M54 166q6 5 12 0'/><path d='M120 140l12-22 12 22zM126 140v18M138 140v18'/><path d='M185 150a16 16 0 1 1 0 30 12 12 0 0 0 0-30z'/><path d='M20 200l10-10 10 10 10-10'/><path d='M100 196h30M115 181v30'/></svg>");background-size:220px 220px}
#call .panel3{margin:0 16px;background:var(--call-surface);border-radius:24px;padding:18px 8px 14px;display:grid;grid-template-columns:repeat(3,1fr);row-gap:12px;flex:none}
#call .panel3 .ctl{width:auto}
#call .panel3 .ctl .b{width:64px;height:64px}
#call .panel3 .ctl .l{font-size:14px;color:#fff}
#call .panel3 .ctl.end{margin-left:0}
#call .panel3 .ctl.end .b{width:64px;border-radius:50%}

/* ---------- senaryo tetikleyicileri (panel + Diğer sayfası) ---------- */
const one = () => S && !isG();
const conn = () => S && S.phase === 'connected';
const TRIG = [
  { k: 'in-voice', t: 'Gelen sesli arama', on: () => !S, run: () => start({ kind: 'voice', who: 'ayse', phase: 'incoming', inc: true }) },
  { k: 'in-video', t: 'Gelen görüntülü arama', on: () => !S, run: () => start({ kind: 'video', who: 'ayse', phase: 'incoming', inc: true }) },
  { k: 'answer', t: 'Karşı taraf açsın', on: () => one() && S.phase === 'ringing', run: answer },
  { k: 'noanswer', t: 'Cevap vermesin', on: () => one() && S.phase === 'ringing', run: noAnswer },
  { k: 'peermute', t: 'Karşı taraf mikrofonunu kapatsın', on: () => one() && conn(), run: () => { S.peerMuted = !S.peerMuted; } },
  { k: 'weak', t: 'Bağlantı zayıflasın', on: () => one() && conn() && !S.easy && !S.weak, run: () => { S.weak = true; } },
  { k: 'drop', t: 'Bağlantı kopsun', on: () => one() && conn(), run: () => { S.phase = 'reconnecting'; S.rc0 = Date.now(); S.weak = false; later('rc', 14000, recover); } },
  { k: 'recover', t: 'Bağlantı geri gelsin', on: () => one() && S.phase === 'reconnecting', run: () => recover() },
  { k: 'join', t: 'Birisi katılsın', on: () => S && isG() && conn(), run: () => { const r = S.people.find((p) => p.state === 'ringing'); if (r) joinPerson(r.id); else { const x = addPerson(true); if (x) joinPerson(x.id); } } },
  { k: 'speaker', t: 'Konuşan değişsin', on: () => S && isG() && conn(), run: nextTalker },
];
function demoSync() { ['inVoice', 'inVideo'].forEach((id) => { const b = $(id); if (b) b.disabled = !!S; }); }
function recover() { if (S && S.phase === 'reconnecting') { clearTimeout(S.tm.rc); S.phase = 'connected'; toast('Bağlantı geri geldi'); render(); } }

/* ---------- eylemler ---------- */
const open = (s) => { S.sheet = s; S.fresh = true; if (s === 'transcript') { S.findOn = false; S.shareOpen = false; } if (s === 'ccset') S.langOpen = false; };
const pipArm = () => later('pipctl', 4000, () => { S.pipCtl = false; render(); });
const tsText = () => {   // kaydı açık sekmeye göre düz metne çevirir (Çeviri: okuma dilin + karşı taraf; Orijinal: konuşulan dil + çevirisi)
  const p = isG() ? null : peer(), who = (l) => (l.me ? 'Sen' : p ? p.name : 'Katılımcı');
  const head = 'BiP · Konuşma kaydı · ' + (p ? p.name : GROUPS[S.who].title) + ' · ' + (S.tab === 'ceviri' ? 'Çeviri' : 'Orijinal') + ' · ' + new Date().toLocaleDateString('tr-TR');
  return head + '\n\n' + S.lines.map((l) => { const [a, b] = S.tab === 'ceviri' ? capView(l, 1) : ovView(l); return '[' + fmt(l.t) + '] ' + who(l) + ': ' + a + (b ? '\n        ' + b : ''); }).join('\n');
};
const ACT = {
  mic() { S.mic = !S.mic; if (S.pip && S.pipCtl) pipArm(); },
  cam() { if (S.kind === 'voice') { S.kind = 'video'; S.cam = true; } else S.cam = !S.cam; },
  out() { open('audio'); },
  outset(d) { S.out = d.k; S.sheet = null; },
  more() { open('more'); },
  sheetx() { S.sheet = null; S.kickAsk = null; },
  cc() { open('ccset'); },
  ccgo() { S.captions = !S.captions; if (S.captions) { S.lines.length || addLine(false); capLoop(); } else clearTimeout(S.tm.cap); S.sheet = null; },
  ccmode(d) { S.capMode = d.k; },
  langtoggle() { S.langOpen = !S.langOpen; },
  langset(d) { S.capLang = d.k; S.langOpen = false; },
  capsize(d) { S.capSize = +d.k; },
  bubble() { open('transcript'); },
  tab(d) { S.tab = d.k; },
  findtoggle() { S.findOn = !S.findOn; if (!S.findOn) S.find = ''; S.focusFind = S.findOn; },
  tshare() { if (!S.lines.length) { toast('Henüz kaydedilecek konuşma yok'); return; } S.shareOpen = !S.shareOpen; },
  tsave() {
    try {
      const url = URL.createObjectURL(new Blob(['﻿' + tsText()], { type: 'text/plain;charset=utf-8' })), a = document.createElement('a');
      a.href = url; a.download = 'bip-konusma-kaydi-' + (S.tab === 'ceviri' ? 'ceviri' : 'orijinal') + '.txt'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000); toast('Konuşma kaydı dosyaya kaydedildi');
    } catch (e) { toast('Dosya kaydedilemedi'); }
    S.shareOpen = false;
  },
  tcopy() {
    try { navigator.clipboard.writeText(tsText()).then(() => toast('Konuşma kaydı panoya kopyalandı'), () => toast('Panoya kopyalanamadı')); } catch (e) { toast('Panoya kopyalanamadı'); }
    S.shareOpen = false;
  },
  easyon() { S.easy = true; S.weak = false; S.sheet = null; },

  tovoice() { S.kind = 'voice'; S.cam = false; S.weak = false; },
  pg(d) { const n = document.querySelectorAll('.page').length; S.page = Math.max(0, Math.min(n - 1, S.page + +d.k)); },
  share() { S.sharing = !S.sharing; S.sheet = null; toast(S.sharing ? 'Ekran paylaşımı başladı' : 'Ekran paylaşımı durdu'); },
  pip() { S.pip = true; S.pipCtl = false; S.sheet = null; },
  unpip() { S.pip = false; S.pipCtl = false; },
  pipctl() { S.pipCtl = !S.pipCtl; if (S.pipCtl) pipArm(); },
  flip() { S.flipped = !S.flipped; toast(S.flipped ? 'Arka kamera' : 'Ön kamera'); },
  add() {
    if (isG() && !addable().length) { toast('Herkes zaten aramada'); return; }
    if (!isG() && S.phase !== 'connected') { toast('Arama bağlanınca kişi ekleyebilirsin'); return; }
    open('addp');
  },
  addto(d) {   // birebir aramaya kişi ekle: görüşme grup aramasına dönüşür, eklenen kişi "Aranıyor…" olur

    GROUPS.ozel = { title: groupTitle([p.short, q.short]), pool: [p, q].concat(rest), start: 2 };

  vmsend() { toast('Sesli mesaj gönderildi'); S.sheet = null; },
  chat() { open('chat'); S.focusChat = true; },
  send() {
    const m = (S.draft || '').trim(); if (!m) return;

  },
  people() { open('people'); S.kickAsk = null; },
  pmute(d) { const p = S.people.find((x) => x.id === d.id); if (p) { p.muted = true; toast(p.short + ' susturuldu'); } },
  pkickask(d) { S.kickAsk = d.id; },
  pkickno() { S.kickAsk = null; },
  pkick(d) { const p = S.people.find((x) => x.id === d.id); S.kickAsk = null; dropPerson(d.id); if (p) toast(p.short + ' aramadan çıkarıldı'); },
  layout(d) { S.layout = d.k; S.sheet = null; toast(d.k === 'speaker' ? 'Görünüm: konuşan öne çıkar' : 'Görünüm: ızgara'); },
  vmsg() { S.vm0 = Date.now(); open('vmsg'); },
  msg() { open('chat'); S.focusChat = true; },
  reply(d) { toast('Gönderildi: ' + ['Müsait olunca arar mısın?', 'Sonra tekrar arayacağım', 'Acil, döner misin?'][+d.k]); },
};

/* ---------- çizim ---------- */
function view() {
  if (S.phase === 'spec') return specView();
  if (S.phase === 'incoming') return incomingView();
  if (S.pip) return pipView();
  if (S.phase === 'noanswer' || S.phase === 'ended') return endView();
  if (S.phase === 'reconnecting') return reconView();
  if (isG()) return groupView();
  if (S.easy) return easyView();
  if (S.kind === 'voice' && !S.cam) return voiceView();
  return videoView();
}
let lastSid = null;
function render() {
  const root = $('call'), f = document.activeElement, fresh = !!(S && S.fresh);
  const fk = f && root.contains(f) && f.dataset && f.dataset.act ? [f.dataset.act, f.dataset.k || '', f.dataset.id || ''] : null;
  let sid = 'idle';
  if (!S) { root.innerHTML = ''; } else {
    sid = screenId(); root.innerHTML = view() + sheetHtml(); S.fresh = false;
  }
  const wall = !!S && S.phase !== 'spec' && !S.pip && (['noanswer', 'ended', 'reconnecting', 'incoming'].includes(S.phase) || (!isG() && S.kind === 'voice' && !S.cam && !S.easy));
  root.hidden = !S; $('phone').classList.toggle('incall', !!S);
  root.classList.toggle('wall', wall); root.dataset.screen = sid; root.dataset.layout = S && isG() ? (items().length >= 9 ? 'crowd' : 'grid') : '';
  if (fk) { const sel = `[data-act="${fk[0]}"]${fk[1] ? `[data-k="${fk[1]}"]` : ''}${fk[2] ? `[data-id="${fk[2]}"]` : ''}`; const el = root.querySelector(sel); if (el) el.focus({ preventScroll: true }); }

  if (hit('#s-clear')) { HIST.length = 0; shRender(); shClose(); toast('Arama geçmişi temizlendi'); return; }
  const tab = hit('[data-tab]'); if (tab) return toast(tab.dataset.tab + ' · bu kopyada açık değil');
  const ts = hit('[data-toast]'); if (ts) return toast(ts.dataset.toast + ' · bu kopyada açık değil');
  const inf = hit('[data-info]'); if (inf) return shDetail(+inf.dataset.info);
  if (hit('#s-dback')) { shDetailHide(); const b = document.querySelector('#s-list [data-info="' + infoIdx + '"]'); if (b) b.focus({ preventScroll: true }); return; }
  const dc = hit('[data-dcall]'); if (dc) return start(ozel([dc.dataset.dcall], 'video'));
  const row = hit('[data-hi]'); if (row) { const h = HIST[+row.dataset.hi]; return start(ozel(h.names, h.k)); }
  const sc = hit('[data-shcall]'); if (sc) { const h = HIST[infoIdx]; return start(ozel(h.names, sc.dataset.shcall)); }
  const c = hit('[data-c]'); if (c) { const n = c.dataset.c, i = csel.indexOf(n); if (i < 0) { if (csel.length >= 31) return toast('En fazla 31 kişi eklenebilir'); csel.push(n); } else csel.splice(i, 1); return shNew(); }
  const r = hit('[data-rm]'); if (r) { csel.splice(csel.indexOf(r.dataset.rm), 1); return shNew(); }
  const g = hit('[data-start]'); if (g) { const names = csel.slice(); shClose(); return start(ozel(names, g.dataset.start)); }
  const l = hit('[data-l]'); if (l) { const el = $('s-ns-' + l.dataset.l); if (el) $('s-nl').scrollTop = el.offsetTop - $('s-nl').offsetTop; }
});
$('shell').addEventListener('keydown', (e) => { const el = e.target.closest && e.target.closest('.s-row'); if (el && e.target === el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); el.click(); } });
$('s-q').addEventListener('input', shRender);
$('s-nq').addEventListener('input', shNew);
addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (shSheet) shClose(); else shDetailHide(); } });
/* tema: ?tema=koyu|acik → kayıtlı seçim → sistem tercihi. 🌙/☀️ düğmesi yalnız telefon ekranını çevirir (sayfanın kendisi açık kalır); arama ekranı her temada koyudur */
const THEME_KEY = 'bip-tema', dm = matchMedia('(prefers-color-scheme: dark)'), urlT = Q.get('tema');
let storedT = null; try { storedT = localStorage.getItem(THEME_KEY); } catch (e) { /* depolama kapalı olabilir */ }
function setTheme(on, save) {
  $('phone').classList.toggle('dark', on);
  const b = $('darkSw'); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); b.textContent = on ? '☀️ Aydınlık mod' : '🌙 Koyu mod';
  if (save) { try { localStorage.setItem(THEME_KEY, on ? 'koyu' : 'acik'); } catch (e) { /* yoksay */ } }
}
setTheme(urlT ? urlT === 'koyu' : storedT ? storedT === 'koyu' : dm.matches, false);
$('darkSw').addEventListener('click', () => setTheme(!$('phone').classList.contains('dark'), true));
dm.addEventListener('change', (e) => { if (!urlT && !storedT) setTheme(e.matches, false); });
shRender();

$('inVoice').addEventListener('click', () => window.BipArama.trig('in-voice'));
$('inVideo').addEventListener('click', () => window.BipArama.trig('in-video'));
if (Q.get('ekran') && P[Q.get('ekran')]) jump(Q.get('ekran')); else { const o = fromAra(Q.get('ara'), Q.get('tur'), (Q.get('kisi') || '').split(',').filter(Boolean)); if (o) start(o); else render(); }

/* telefon çerçevesi ölçeği: telefon + üst çubuk görünen alana tamamen sığar (masaüstü ve mobilde aynı) */
function fit() {
  const ph = $('phone'), st = $('stage'), bs = getComputedStyle(document.body), cap = $('cap');
  const px = parseFloat(bs.paddingLeft) + parseFloat(bs.paddingRight), py = parseFloat(bs.paddingTop) + parseFloat(bs.paddingBottom), gap = parseFloat(bs.rowGap) || 0, bezel = 22;
  const k = Math.min(1, (document.documentElement.clientWidth - px - bezel) / 390, (innerHeight - py - cap.offsetHeight - gap - bezel) / 844);
  ph.style.transform = k < 1 ? `scale(${k})` : ''; st.style.width = 390 * k + 'px'; st.style.height = 844 * k + 'px';
}
addEventListener('orientationchange', () => setTimeout(fit, 250));
addEventListener('resize', fit); fit();
window.BipArama = { jump, start, get state() { return S; }, trig(k) { const t = TRIG.find((x) => x.k === k); if (!t || !t.on()) return false; t.run(); render(); return true; } };   // geliştirici kısayolu (arayüzde yok)
})();
</script>
